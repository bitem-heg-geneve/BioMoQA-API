services:
  mongo:
    image: mongo:7
    container_name: api-mongo-1
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    networks:
      - dbnet

  redis:
    image: redis:7
    container_name: api-redis-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    networks:
      - dbnet

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: api-worker
    container_name: api-worker-1
    restart: unless-stopped
    working_dir: /app
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MONGO_URI: mongodb://mongo:27017/biomoqa-triage
      MONGO_DB: biomoqa-triage
      APP_NAME: BioMoQA-Triage API
      HF_MODEL_BASE_DIR: /models/checkpoints
      HF_MODEL_BASE_DIR_V2: /models/checkpoints_v2
      HF_MODEL_BASE_DIR_V3: /models/checkpoints_v3
      HF_MODEL_PREFIX: best_model_cross_val_BCE_roberta-base
      HF_NUM_FOLDS: "5"
      HF_DEVICE: "-1"
      OMP_NUM_THREADS: "12"
      MKL_NUM_THREADS: "12"
      TOKENIZERS_PARALLELISM: "false"
      MAX_TOKENS: "512"
      INFER_BATCH_SIZE: "64"
      INGRESS_BATCH_SIZE: "128"
      # Shared triage guard: the text source is required (no default in the
      # code), base URL without a trailing slash.
      SIBILS_URL: "${BIOMOQA_SIBILS_URL:-https://biodiversitypmc.sibils.org/api}"
      # Readiness gate before the worker starts (app/readiness.py): every
      # version in BIOMOQA_READINESS_VERSIONS must score the control texts as
      # expected, and SIBiLS must return the control PMID. Set
      # BIOMOQA_READINESS_FETCH=0 only for offline development.
      BIOMOQA_READINESS_VERSIONS: "${BIOMOQA_READINESS_VERSIONS:-v1,v2,v3}"
      BIOMOQA_READINESS_MIN: "${BIOMOQA_READINESS_MIN:-0.6}"
      BIOMOQA_READINESS_FETCH: "${BIOMOQA_READINESS_FETCH:-1}"
    volumes:
      - ../model/checkpoints:/models/checkpoints:ro
      - ../model/checkpoints_v2:/models/checkpoints_v2:ro
      - ../model/checkpoints_v3:/models/checkpoints_v3:ro
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    # Readiness first, then the worker (same order as the Dockerfile CMD): a
    # worker that would score with the wrong model or without a text source
    # never starts, and `docker compose ps` shows it restarting.
    command:
      - sh
      - -c
      - >-
        /app/.venv/bin/python -m app.readiness
        && exec /app/.venv/bin/celery -A app.worker.celery_app:app worker
        --loglevel=INFO --queues=ingress,infer
        --hostname=worker@%h --concurrency=4 --prefetch-multiplier=1
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    networks:
      - appnet
      - dbnet

  flower:
    image: mher/flower:2.0.1
    container_name: api-flower-1
    restart: unless-stopped
    environment:
      FLOWER_PORT: "5555"
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:5556:5555"
    depends_on:
      redis:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - appnet
      - dbnet

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: api-api
    container_name: api-api-1
    restart: unless-stopped
    environment:
      APP_NAME: BioMoQA-Triage API
      API_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:3000,http://localhost:8501
      MONGO_URI: mongodb://mongo:27017/biomoqa-triage
      MONGO_DB: biomoqa-triage
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      HF_MODEL_BASE_DIR: /models/checkpoints
      HF_MODEL_BASE_DIR_V2: /models/checkpoints_v2
      HF_MODEL_BASE_DIR_V3: /models/checkpoints_v3
      HF_MODEL_PREFIX: best_model_cross_val_BCE_roberta-base
      HF_NUM_FOLDS: "5"
      HF_DEVICE: "-1"
      OMP_NUM_THREADS: "12"
      MKL_NUM_THREADS: "12"
      TOKENIZERS_PARALLELISM: "false"
      MAX_TOKENS: "512"
      INFER_BATCH_SIZE: "64"
      INGRESS_BATCH_SIZE: "128"
      # /readyz fetches the control PMID from the same text source as the worker.
      SIBILS_URL: "${BIOMOQA_SIBILS_URL:-https://biodiversitypmc.sibils.org/api}"
    volumes:
      - ../model/checkpoints:/models/checkpoints:ro
      - ../model/checkpoints_v2:/models/checkpoints_v2:ro
      - ../model/checkpoints_v3:/models/checkpoints_v3:ro
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    command: >
      sh -c "uv run uvicorn app.main:app --host 0.0.0.0 --port 8501"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - appnet
      - dbnet

volumes:
  mongo_data:

networks:
  frontend:
  appnet:
  dbnet:
